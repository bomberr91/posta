<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Free LLM Hub</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--txt:#e6edf3;--mut:#8b949e;--blu:#58a6ff;--verde:#3fb950;--rosso:#f85149;--giallo:#d29922;--viola:#a371f7}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;margin:0;display:flex;overflow:hidden}
button{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--blu)}
button.pri{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:700}
button.pri:disabled{opacity:.5;cursor:default}
select,input,textarea{background:var(--bg);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px}
#wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
/* ── barra laterale (chat) ── */
#sidebar{width:272px;flex:none;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px;gap:8px;min-height:0}
.slogo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:2px 4px}
.slogo .sp{flex:1}
.icobtn{border:none;background:none;padding:2px 6px;font-size:14px;color:var(--mut)}
#hamb{display:none}
.newchat{background:var(--verde);border-color:var(--verde);color:#04170a;font-weight:700;text-align:left}
.ssearch{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:4px 8px}
.ssearch input{border:none;background:none;flex:1;min-width:0;padding:2px 0;font-size:12.5px}
.ssearch input:focus{outline:none}
.ssearch .icobtn{display:none}
#sblist{flex:1;overflow-y:auto;min-height:0;padding-right:2px}
.ssec{font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:700;padding:8px 6px 3px}
.chatitem{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.selbox{font-size:15px;line-height:1;flex:0 0 auto}
.chatitem.selon{outline:1px solid var(--blu)}
.selbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:11px;margin-bottom:6px;background:var(--card)}
.selbar button{font-size:11px;padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--txt)}
.chatitem:hover{background:rgba(88,166,255,.08)}
.chatitem.on{background:rgba(88,166,255,.15);box-shadow:inset 3px 0 0 var(--blu)}
.chatitem .ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatitem .dots,.folderrow .dots{border:none;background:none;color:var(--mut);padding:0 5px;font-size:14px;opacity:0;flex:none}
.chatitem:hover .dots,.folderrow:hover .dots{opacity:1}
.chatitem input{width:100%;font-size:12.5px;padding:2px 6px}
.folderrow{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.folderrow:hover{background:rgba(88,166,255,.08)}
.folderrow .farrow{width:12px;color:var(--mut);flex:none}
.folderrow .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folderrow .fcount{font-size:10px;color:var(--mut)}
.sbottom{border-top:1px solid var(--border);padding-top:8px}
.sbottom .srowbtn{width:100%;text-align:left;font-size:12.5px}
#sbbk{display:none}
/* ── colonna chat ── */
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card)}
header h1{font-size:16px;margin:0}
header .sp{flex:1}
.badge{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--mut)}
.gear{font-size:16px;padding:4px 10px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:10px 14px;border-radius:12px;line-height:1.55;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#1f3a5f;border:1px solid #2d5a8e}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--border)}
.msg.error{align-self:stretch;background:#3d1418;border:1px solid var(--rosso);color:#ffb3ad;font-size:13px}
.msg .who{font-size:10px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.msg pre{background:#000;border:1px solid var(--border);border-radius:6px;padding:8px;overflow-x:auto;font-size:12px;white-space:pre}
.msg code{background:#000;border-radius:4px;padding:1px 5px;font-size:12px}
.msg .src{font-size:11px;color:var(--mut);margin-top:8px;border-top:1px solid var(--border);padding-top:6px;white-space:normal}
.codebox{border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;background:#010409;padding:3px 10px;font-size:10px;color:var(--mut)}
.codebar .cc{font-size:10px;padding:1px 8px}
.codebox pre{margin:0;border:none;border-radius:0}
.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.abtn{font-size:11px;padding:3px 9px;background:var(--bg)}
.cbtn{font-size:12px;padding:5px 10px;background:var(--bg)}
.cbtn:disabled{opacity:.45;cursor:default}
.srcbtn{margin-top:8px}
#attrow{display:none;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.atchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 9px;background:var(--bg);border:1px solid var(--border);border-radius:14px;max-width:280px}
.atchip img{width:22px;height:22px;object-fit:cover;border-radius:4px}
.atchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atchip b{cursor:pointer;color:var(--mut)}
#model{max-width:220px;font-size:12px;padding:4px 6px}
.mmeta{font-size:10.5px;color:var(--mut);margin-top:6px}
.mmeta b{color:var(--blu);font-weight:600}
.chips{margin:2px 0 6px}
.chip{font-size:10.5px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;display:inline-block;color:var(--mut)}
.chip.ok{color:var(--verde);border-color:rgba(63,185,80,.45)}
.chip.ko{color:var(--rosso);border-color:rgba(248,81,73,.45)}
.chip.judge{color:var(--viola);border-color:rgba(163,113,247,.45)}
.fmeta{font-size:11px;color:var(--mut);margin-top:6px}
.fmeta b{color:var(--viola);font-weight:600}
#bottom{border-top:1px solid var(--border);padding:10px 16px;background:var(--card)}
#controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#sysrow{margin-bottom:8px}
#sysrow textarea{width:100%;font-size:12px;color:var(--mut)}
#inputrow{display:flex;gap:8px;align-items:flex-end}
#q{flex:1;resize:none;min-height:44px;max-height:160px;font-size:14px;padding:10px}
#opt{background:rgba(163,113,247,.15);border-color:#a371f7;color:#d2a8ff;font-weight:700}
#undo{display:none;font-size:11px;color:var(--mut)}
label.webt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);cursor:pointer}
#web{accent-color:var(--verde)}
#god{accent-color:var(--rosso)}
#godl.on{color:var(--rosso)}
#keep{accent-color:var(--blu)}
/* ── drawer impostazioni ── */
#drawer{width:380px;max-width:92vw;border-left:1px solid var(--border);background:var(--card);overflow-y:auto;padding:16px;display:none}
#drawer.open{display:block}
.prov{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
.prov h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rosso);display:inline-block}
.dot.ok{background:var(--verde)}
.prov .quota{font-size:11px;color:var(--mut);margin:4px 0 8px;line-height:1.4}
.prov input{width:100%;font-size:12px;margin-bottom:6px}
.prov a{color:var(--blu);font-size:11px;text-decoration:none}
.prov .warn{font-size:10px;color:var(--giallo);margin-top:4px}
details{margin-bottom:12px}
summary{cursor:pointer;font-size:13px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:11px;margin-top:8px}
th,td{border:1px solid var(--border);padding:4px 6px;text-align:left}
th{color:var(--mut)}
.hint{font-size:11px;color:var(--mut);line-height:1.5}
footer{padding:6px 16px;font-size:10px;color:var(--mut);border-top:1px solid var(--border);background:var(--card)}
/* ── menù contestuale ── */
#ctxmenu{position:fixed;z-index:100;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:5px;min-width:190px;display:none}
#ctxmenu .mi{padding:7px 12px;border-radius:7px;font-size:12.5px;cursor:pointer}
#ctxmenu .mi:hover{background:rgba(88,166,255,.12)}
#ctxmenu .msep{height:1px;background:var(--border);margin:4px 6px}
@media(max-width:820px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .18s;box-shadow:8px 0 30px rgba(0,0,0,.4)}
  #sidebar.open{transform:none}
  #sbbk.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  #hamb{display:inline-block}
  .msg{max-width:94%}
}
/* ── i tre pallini del caricamento (richiesta utente 12/10): si vede subito che il sistema lavora ── */
.vcount{font-size:12px;color:var(--mut);margin-right:8px;vertical-align:middle;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:4px;align-items:center;margin:2px 0 0 1px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block;animation:dotb 1.05s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes dotb{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

</style>
</head>
<body>
<aside id="sidebar">
  <div class="slogo"><span>⚡ Free LLM Hub</span><span class="sp"></span><button class="icobtn" id="closesb" title="chiudi">✕</button></div>
  <button class="newchat" id="newchat">＋ Nuova chat</button>
  <div class="ssearch"><span>🔍</span><input id="sbsearch" placeholder="cerca nelle chat…"><button class="icobtn" id="sbsclear">✕</button></div>
  <div id="sblist"></div>
  <details id="fusionArchive" style="margin:6px 8px 10px;padding:8px;border:1px solid var(--border);border-radius:8px">
    <summary style="cursor:pointer;font-size:12px;font-weight:650">📂 Risultati Fusion salvati</summary>
    <input id="fusionArchiveSearch" type="search" placeholder="cerca nei risultati…" style="width:100%;margin:7px 0;padding:6px;background:var(--bg);color:var(--txt);border:1px solid var(--border);border-radius:5px">
    <div id="fusionArchiveList" class="hint" style="font-size:11px">Apri per leggere l’archivio.</div>

      <header>

        <h1>⚡ Free LLM Hub</h1>

        <label class="webt" id="keepl" title="Se acceso, cambiando modello RESTI in questa chat (non se ne crea una nuova)"><input type="checkbox" id="keep">📌 mantieni la chat</label>

      <div id="bottom">
        <div id="controls">

          <button class="cbtn" id="bSum" title="Riassume l'ULTIMA risposta del modello in 5-8 punti (modello veloce, istantaneo)">📝 Riassunti</button>
          <button class="cbtn" id="bMosse" title="Dall'ULTIMA risposta: I FATTI + LE MOSSE numerate — ogni mossa con COSA fare e COME farla">🎯 Le mosse</button>
          <button class="cbtn" id="bFocus" title="Controproba con squadra focalizzata in ricerca profonda: 3 analisti + giudice (con riserve e giudice riserva) verificano a fondo l'ultima risposta">🔍 Focus</button>
          <button class="cbtn" id="bTeam" style="display:none" title="Gestisci questa fusion: approvala (⭐ fidata), rimettila in prova (🧪) o eliminala — le chat legate migrano dove scegli tu">⚙ fusion</button>

          <button id="opt" title="Ottimizza il prompt: lo riscrive in versione professionale">✨</button>

          <input type="file" id="filein" multiple style="display:none" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif,image/svg+xml,image/tiff,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.svg,.ico,.tiff,.tif,.txt,.md,.pdf,.docx,.odt,.csv,.json,.xml,.html,.htm,.log,.py,.js,.ts,.java,.c,.cpp,.cs,.php,.rb,.go,.rs,.sql,.sh,.yml,.yaml,.ini,.cfg,.toml,.tex">
        </div>
      </div>
    </div>
    <div id="drawer"></div>
  </div>
  <footer>Dashboard storica Posta · chat via Router Hub locale · cronologia e preferenze nel browser, chiavi nel portachiavi del PC · endpoint locale agenti: <b>/v1/chat/completions</b>.</footer>
</div>
<div id="ctxmenu"></div>

<script>
/* ===== SOLO ANTEPRIMA: motore finto, nessuna rete ===== */
(function(){
  function j(o,status=200){return new Response(JSON.stringify(o),{status,headers:{'Content-Type':'application/json'}})}
  const __REAL_FETCH = window.fetch ? window.fetch.bind(window) : null;
  const LIVE = (location.port === '20200');   // porta locale Posta: le chiamate arrivano al Router Hub reale
  window.__LIVE = LIVE;
  window.fetch = async function(url,opt){
    const u=String(url);
    // sul PC (LIVE) si va SEMPRE al server vero: niente motore finto, niente risposte di prova —
    // compresa /api/chat, che così riceve anche le istruzioni di sistema (✨, 😈, 📈, 📑)
    if (LIVE && u.startsWith('/api/')) {
      return __REAL_FETCH(url, opt);
    }
    try{
      if(u.includes('/api/chat')||u.includes('/chat/completions')){
        return j({error:{message:'Anteprima offline: avvia la dashboard Posta sul PC per usare il Router Hub locale.'}},503);
      }
      if(u.includes('/api/modelli')) return j({data:[],pronti:0,pronti_verificati:0,totali:0});
      if(u.includes('/models')) return j({data:[]});
      if(u.includes('/usage')) return j({ok:true});
      if(u.includes('/api/search')) return j({error:{message:'Ricerca disponibile solo con la Centrale locale avviata.'}},503);
      return j({});
    }catch(e){ return j({error:{message:String(e)}}); }
  };
})();
</script>
<script>
'use strict';
// ══════════ storage sicuro (localStorage con fallback in memoria) ══════════
const MEM = {};
function lsGet(k){ try { return localStorage.getItem(k); } catch { return MEM[k] ?? null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch { MEM[k]=v; } }

// ══════════ provider UI storico: ora delega al Router Hub locale di Posta ══════════
const PROVIDERS = {
  routerhub:{label:'Router dell’Hub · primario 🔌',keyUrl:'',quota:'La chat passa dal router locale dell’Hub; scegli la modalità qui sotto. Le chiavi upstream restano nel portachiavi del PC.',warn:'',models:[['auto:smart','🧠 consigliato'],['auto:fast','⚡ veloce'],['tailor','🎯 fusion su misura'],['vision','🖼️ visione'],['docs','📑 documenti'],['code','💻 fusion code'],['trading','📈 fusion trading']]},
};
function customModels(p){ return (lsGet('fh_custom_'+p)||'').split(',').map(s=>s.trim()).filter(Boolean); }
// Compatibilità col codice storico: è solo un segnaposto locale, mai una credenziale.
function getKey(p){ return p==='routerhub' ? 'router-locale' : ''; }

// ══════════ stato: chat multiple + cartelle (localStorage) ══════════
let chats = [];    // {id,title,pinned,folder,created,updated,msgs:[{role,content,model,via,web,sources,fusion}]}
let folders = [];  // {id,name,collapsed}
let selMode = false, selSet = new Set(); // ☑ selezione multipla chat (elimina/sposta in massa)
let activeId = null;

function loadState(){
  try { chats = JSON.parse(lsGet('fh_chats')||'[]'); } catch { chats = []; }
  if (!Array.isArray(chats)) chats = [];
  let migrated=false;
  const migrateRouterKey=x=>typeof x==='string'&&x.startsWith('freellmapi/')?'routerhub/'+x.slice('freellmapi/'.length):x;
  const oldModel=lsGet('fh_model');
  if(oldModel && migrateRouterKey(oldModel)!==oldModel){ lsSet('fh_model',migrateRouterKey(oldModel)); migrated=true; }
  for(const c of chats) for(const m of (c.msgs||[])) if(m && typeof m.sel==='string'){ const v=migrateRouterKey(m.sel); if(v!==m.sel){m.sel=v;migrated=true;} }
  if(lsGet('fh_custom_freellmapi')!==null){ lsSet('fh_custom_routerhub',lsGet('fh_custom_freellmapi')||''); migrated=true; }
  try { folders = JSON.parse(lsGet('fh_folders')||'[]'); } catch { folders = []; }
  if (!Array.isArray(folders)) folders = [];
  activeId = lsGet('fh_active');
  if (!chats.length) newChat(true);
  else if (!chats.some(c=>c.id===activeId)) activeId = chats[0].id;
  if(migrated) saveChats();
}
function saveChats(){
  try { lsSet('fh_chats', JSON.stringify(chats)); }
  catch {
    // spazio esaurito: butto le chat più VECCHIE non fissate finché entra
    const pin = chats.filter(c=>c.pinned);
    let rest = chats.filter(c=>!c.pinned).sort((a,b)=>b.updated-a.updated);
    while (rest.length > 1){
      rest.pop();
      chats = [...pin, ...rest];
      if (!chats.some(c=>c.id===activeId)) activeId = chats[0].id;
      try { lsSet('fh_chats', JSON.stringify(chats)); renderSidebar(); renderChat(); return; } catch {}
    }
  }
}
function saveFolders(){ try { lsSet('fh_folders', JSON.stringify(folders)); } catch {} }
function cur(){ return chats.find(c=>c.id===activeId) || null; }
function touch(c){ c.updated = Date.now(); }
function newChat(silent){
  const c = { id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:'Nuova chat', pinned:false, folder:null, created:Date.now(), updated:Date.now(), msgs:[] };
  chats.unshift(c); activeId = c.id; saveChats();
  if (!silent){ renderSidebar(); renderChat(); closeSb(); }
}
function delChat(id){
  chats = chats.filter(c=>c.id!==id);
  if (activeId===id){ activeId = chats[0] ? chats[0].id : null; if (!activeId) newChat(true); }
  saveChats(); renderSidebar(); renderChat();
}

// ══════════ dom refs ══════════
const $ = id => document.getElementById(id);
const msgsEl=$('msgs'), qEl=$('q'), sendB=$('send'), stopB=$('stop'), optB=$('opt'), undoB=$('undo'),
      sel=$('model'), sblist=$('sblist'), sbsearch=$('sbsearch'), sbsclear=$('sbsclear'),
      drawer=$('drawer'), ctxmenu=$('ctxmenu'), sidebar=$('sidebar'), sbbk=$('sbbk');

// ══════════ barra laterale ══════════
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function chatItemHTML(c){
  const sel = selMode && selSet.has(c.id);
  return `<div class="chatitem ${c.id===activeId?'on':''} ${sel?'selon':''}" data-id="${c.id}">${selMode?'<span class="selbox">'+(sel?'☑':'☐')+'</span>':''}<span class="ct">${esc(c.title||'Nuova chat')}</span>${selMode?'':'<button class="dots" data-menu="'+c.id+'" title="opzioni">⋯</button>'}</div>`;
}
function renderSidebar(){
  const fq = (sbsearch.value||'').trim().toLowerCase();
  sbsclear.style.display = fq ? '' : 'none';
  let h = '';
  if (selMode) h += selBarHTML();
  if (fq){
    const hits = chats.filter(c => (c.title||'').toLowerCase().includes(fq) || c.msgs.some(m=>(m.content||'').toLowerCase().includes(fq)));
    h += `<div class="ssec">🔎 RISULTATI (${hits.length})</div>`;
    h += hits.slice(0,40).map(chatItemHTML).join('') || '<div class="hint" style="padding:4px 8px">niente trovato</div>';
  } else {
    const byUpd = (a,b)=>b.updated-a.updated;
    const pinned = chats.filter(c=>c.pinned).sort(byUpd);
    if (pinned.length) h += '<div class="ssec">📌 FISSATE</div>' + pinned.map(chatItemHTML).join('');
    const folderRow = (f)=>{
      const inside = chats.filter(c=>c.folder===f.id).sort(byUpd);
      let fh = `<div class="folderrow" data-fold="${f.id}"><span class="farrow">${f.collapsed?'▸':'▾'}</span><span class="fname">📁 ${esc(f.name)}</span><span class="fcount">${inside.length}</span><button class="dots" data-fmenu="${f.id}" title="opzioni cartella">⋯</button></div>`;
      if (!f.collapsed) fh += inside.map(chatItemHTML).join('');
      return fh;
    };
    for (const f of folders){ if (f.id!=='__arch') h += folderRow(f); }
    const root = chats.filter(c=>!c.pinned && !c.folder).sort(byUpd);
    h += '<div class="ssec">ULTIME</div>' + (root.map(chatItemHTML).join('') || '<div class="hint" style="padding:4px 8px">nessuna chat</div>');
    const arch = folders.find(f=>f.id==='__arch'); // l'Archivio sta sempre in FONDO alla barra, chiuso
    if (arch) h += folderRow(arch);
  }
  sblist.innerHTML = h;
}

// ══════════ rendering chat ══════════
function mdLite(s){
  let h = esc(s);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,lang,c)=>`<div class="codebox"><div class="codebar"><span>${lang||'code'}</span><button class="cc">📋 copia</button></div><pre>${c}</pre></div>`);
  h = h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  h = h.replace(/\[(\d+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--blu)">[$1]</a>');
  return h;
}
function srcBox(src, i){ // il pulsante 🔍 fonti ora sta nella riga delle azioni, accanto a 🔄 Rigenera (richiesta utente 12/10); qui la tendina che si apre
  if (!src || !src.length) return '';
  return '<div class="src" id="srcbox-'+i+'" style="display:none">' + src.map((r,k)=>`[${k+1}] <a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--blu)">${esc(String(r.title||'').slice(0,60))}</a>`).join(' · ') + '</div>';
}
function msgText(m){
  const c = m && m.content;
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.filter(b=>b && b.type==='text').map(b=>b.text||'').join('\n');
  return '';
}
function shortName(m){ return String(m||'').replace(/^.*\//,'').replace(/:.*$/,'').slice(0,26); }
function fusionChips(f){
  if (!f) return '';
  let h = '<div class="chips">';
  for (const p of (f.panel||[])) h += `<span class="chip ${p.status==='ok'?'ok':'ko'}">${p.status==='ok'?'✓':'✗'} ${esc(shortName(p.model))}</span>`;
  if (f.judge) h += `<span class="chip judge">🧑‍⚖️ ${esc(shortName(f.judge))}</span>`;
  return h + '</div>';
}
// chip durante la PARTITA: si mostrano SOLO i modelli reali della partita, senza doppioni e senza extra oltre i
// posti (richiesta utente 12/10 sera: «ho visto 6 modelli on, in realtà sono 4+giudice» → dal 12/10 notte la squadra è POSTI=3 + giudice). I nomi del centralino
// possono avere prefissi di provider o suffissi (es. «-a12b») diversi dal catalogo: si riconoscono e si aggiorna
// lo stesso chip invece di aggiungerne un altro.
function sameModel(a, b){
  const x = String(a||'').toLowerCase().split('/').pop().replace(/[^a-z0-9.]+/g,'');
  const y = String(b||'').toLowerCase().split('/').pop().replace(/[^a-z0-9.]+/g,'');
  if (!x || !y) return false;
  if (x === y) return true;
  const s = x.length <= y.length ? x : y, l = x.length <= y.length ? y : x;
  return l.startsWith(s) && (l.length - s.length) <= 5; // suffissi brevi tipo «-a12b»
}
function panelMostra(panel, max){
  const out = [];
  for (const p of (panel||[])){
    const i = out.findIndex(x=>sameModel(x.model, p.model));
    if (i >= 0){ out[i] = { model: out[i].model, status: p.status }; continue; } // stesso modello con nome un po' diverso: aggiorna lo stato, il nome resta quello della squadra
    if (out.length < (max||POSTI)) out.push(p);   // oltre i posti non si mostra: la squadra è 3 (+giudice) — POSTI
  }
  return out;
}
function fusionMeta(f, title){
  const ok = (f.panel||[]).filter(x=>x.status==='ok');
  const ko = (f.panel||[]).filter(x=>x.status!=='ok');
  const gj = f.judge ? ` → giudice: <b>${esc(shortName(f.judge))}</b>` : (f.judgePinned ? ` → giudice: ${esc(shortName(f.judgePinned))} <span style="color:var(--mut)">(non ha firmato — risposta del modello migliore)</span>` : '');
  return `<div class="fmeta">${title||'✨ <b>fusion</b>'} — pannello: ${esc(ok.map(x=>shortName(x.model)).join(' · ')||'nessuno')}${ko.length?` <span style="color:var(--mut)">· ${ko.length} fallit${ko.length>1?'i':'o'}: ${esc(ko.map(x=>shortName(x.model)).join(', '))} — ricontrollo a ogni messaggio, rientrano quando rispondono</span>`:''}${gj}</div>`;
}

function getTeams(){ try { return JSON.parse(lsGet('fh_teams')||'[]'); } catch { return []; } }
function saveTeamFrom(i, btn){
  const m = cur().msgs[i]; if (!m || !m.team) return;
  const nome = (prompt('Come vuoi chiamare questa fusion? (la ritrovi nella tendina come 🧪 in prova — la approvi con ⚙ fusion quando ti convince)', '') || '').trim().slice(0,40);
  if (!nome) return;
  const desc = (prompt('Breve descrizione (quella che vedi accanto al nome nella tendina):', '') || '').trim().slice(0,60);
  const teams = getTeams().filter(t=>t.name!==nome); // stesso nome → sovrascrive
  teams.push({ name: nome, desc, approved: false, models: m.team.models, reserves: m.team.reserves||[], judge: m.team.judge||'', judgeReserve: m.team.judgeReserve||'' }); // nasce IN PROVA: la approvi con ⚙ fusion quando ti convince
  lsSet('fh_teams', JSON.stringify(teams));
  const cc = cur(); if (cc){ cc.team = nome; saveChats(); } // da qui in poi QUESTA chat usa quella squadra

function smartResolve(want, ids){ // esatto → suffisso → stessa famiglia prendendo il PIÙ CORTO: «deepseek-v4-flash» trova anche «deepseek/deepseek-v4-flash-0731free»
  const w = String(want||'').toLowerCase();
  const hit = ids.find(id => id === want || id.endsWith('/'+want));
  if (hit) return hit;
  const fam = ids.filter(id => String(id).split('/').pop().toLowerCase().startsWith(w)).sort((a,b)=>a.length-b.length);
  return fam[0];
}
async function getFusionPanel(squad, selKey, noRefresh, ext, onProg){
  try { // LA SQUADRA VIVA (12/10 sera): rientrano i verificati di poco fa (0 chiamate), si pingano solo i posti liberi
    const ids = await getCatalogIds();
    if (ids){
      const panel = await prendiSquadraViva(selKey || 'fusion', squad, ids, ext, onProg);
      if (panel.length >= 2) return panel;
    }
  } catch {}
  try { // catalogo non raggiunto → si compone senza verifica (meglio partire che niente)
    const r = await fetch('/api/modelli');
    if (!r.ok) return null;
    const j = await r.json();
    const ids = (j.data||[]).map(m=>m && (m.id && m.modello ? m.id+'/'+m.modello : m.modello||m.id)).filter(Boolean);
    const dead = fusionDead();
    const bench = quotaBench(); // quota finita (20/giorno i Gemini flash) → panchina fino alle 9:00 italiane
    const resolve = want => smartResolve(want, ids);
    const build = (skip)=>{ const p=[]; for (const want of squad){ const m = resolve(want); if (m && !p.includes(m) && !(skip && (dead.has(String(m).toLowerCase())||bench.has(String(m).toLowerCase())))){ p.push(m); if (p.length>=POSTI) break; } } return p; };
    let panel = build(true);
    if (panel.length < 2) panel = build(false);
    if (panel.length >= 2) return panel;
    // (retro-fallback euristico se un giorno il catalogo cambia tutti i nomi)
    const fam = id => id.toLowerCase().replace(/^.*\//,'').replace(/:.*$/,'');
    const seen = new Set(); const pool = [];
    const take = rx => { for (const id of ids){ const f = fam(id); if (seen.has(f)) continue; if (rx.test(id)){ seen.add(f); pool.push(id); } } };
    take(/coder|codestral|poolside|north-mini/i);
    take(/qwen|gpt-oss|gemini|nemotron|deepseek|dots|kimi|minimax|glm/i);
    const fb = pool.slice(0,POSTI);
    if (fb.length >= 2) return fb;
    return null;
  } catch { return null; }
}

function bumpUsage(key, n){
  if (!key) return;
  const all = usageAll();
  const days = Object.keys(all).sort();
  while (days.length > 7) delete all[days.shift()];
  const k = todayKey();
  all[k] = all[k] || {};
  all[k][key] = (all[k][key]||0) + n;
  try { lsSet('fh_usage', JSON.stringify(all)); } catch {}
}

async function send(){
  const c = cur(); if (!c) return;
  const q = qEl.value.trim(); if ((!q && !atts.length) || ctrl) return;
  qEl.value = '';
  while (c.msgs.length && c.msgs[c.msgs.length-1].role==='error') c.msgs.pop(); // gli errori non si ri-invitano

  let content = q;
  if (docs.length){ // i documenti viaggiano DENTRO il messaggio: la conversazione li ricorda
    const parts = []; let tot = 0;
    for (const d of docs){
      let t = d.text, cut = false;
      if (t.length > 40000){ t = t.slice(0, 40000); cut = true; }
      if (tot + t.length > 60000){ const room = 60000 - tot; if (room < 500) break; if (t.length > room){ t = t.slice(0, room); cut = true; } }
      tot += t.length;
      parts.push('📑 ' + d.name + (cut?' (documento, troncato per lunghezza — fonte per le risposte)':' (documento — fonte per le risposte)') + ':\n' + t);
    }
    content = parts.join('\n\n' + '—'.repeat(18) + '\n\n') + '\n\n' + (q || 'Analizza il documento e dimmi le cose importanti.');
  }
  if (imgs.length) content = [{ type:'text', text: content || "Che cosa c'è in quest'immagine?" }, ...imgs.map(a=>({ type:'image_url', image_url:{ url:a.dataUrl } }))];

  if (c.title==='Nuova chat' || !c.title){

    const t = base.replace(/\s+/g,' ');
    c.title = t.slice(0,38) + (t.length>38?'…':'');

  c.msgs.push({ role:'user', content, ...extras });

    model = 'fusion';
  } else if (model.startsWith('team::')){
    // ⭐ squadra salvata: titolari + riserve se qualcuno manca, giudice compreso
    const nome = model.slice(6);
    whoFusion = '⭐ ' + nome;
    const t = getTeams().find(x=>x.name===nome);
    if (t){
      const ids = (await getCatalogIds()) || [];
      let cfg = applyTeamWithReserves(t, ids);
      const pr = await prendiSquadraViva('team::'+nome, [...(t.models||[]), ...(t.reserves||[])], ids, sig, onProg); // i verificati di poco fa rientrano senza riping
      if (pr && pr.length >= 2) cfg = { models: pr, judge: cfg.judge };
      fusionCfg = { models: cfg.models, expose_panel: true };
      if (cfg.judge) fusionCfg.judge = cfg.judge;
      prendiSquadra(cfg);
      retryBuild = async ()=> applyTeamWithReserves(t, (await getCatalogIds()) || []);
    } else fusionCfg = { expose_panel: true }; // squadra cancellata → fusion auto
    model = 'fusion';
  } else if (model==='fusion'){
    fusionCfg = { expose_panel: true };
  }
  if (annullato()) return; // stop durante la composizione della squadra

  // ── ricerca web: la fa il server (Node, IP di casa) e la inietta come contesto
  const god = $('god').checked; // in trading il toggle si è acceso da solo (syncGodUI); se l'utente lo spegne, vince lui
  let outMsgs = sys ? [{role:'system',content:sys}, ...c.msgs] : [...c.msgs];
  if (god || godAuto) outMsgs = [{role:'system',content:GOD_SYS}, ...outMsgs];
  if (tradingAuto) outMsgs = [{role:'system',content:TRADING_SYS}, ...outMsgs];
  let turnSources = null;
  let webTentata = false;
  // se hai premuto ✨, la ricerca usa la domanda che avevi scritto tu (il prompt ottimizzato è
  // pieno di istruzioni e come domanda da cercare non vale niente: è quello che rovinava i risultati)
  const qWeb = (optOrig && optOrig.trim().length > 3 && optOrig.trim() !== qEl.value.trim()) ? optOrig.trim() : q;
  if (webOn && qWeb){
    webTentata = true;
    const ctx = await serverSearch(qWeb, sig);
    if (ctx){ outMsgs = [{role:'system',content:ctx.c}, ...outMsgs]; turnSources = ctx.r || []; }
    else outMsgs = [{role:'system',content:AVVISO_SENZA_WEB}, ...outMsgs];   // niente fatti inventati
  }
  if (annullato()) return; // stop durante la ricerca web

  // ── bolla live (già a schermo coi pallini: qui si aggancia al pannello e allo stream)
  const fusionEv = fusionCfg ? { panel:[], judge:null } : null;
  let acc = '', servedModel = '', via = '', draft = '';
  const updateLive = ()=>{
    let h = `<div class="who">${fusionEv?(tradingAuto?'📈 trading':whoFusion):esc(dispModel)}${webOn&&turnSources?' 🌐':''}</div>`;
    // chip = SOLO i modelli reali della partita, max POSTI (3) + giudice (niente doppioni né extra: richiesta utente 12/10 sera);
    // se il centralino non manda il suo pannello, si mostrano i verificati così il riepilogo di fine risposta c'è sempre
    const chips = fusionEv ? { panel: fusionEv.panel.length ? panelMostra(fusionEv.panel, POSTI) : panelMostra(prePanel.map(m=>({ model:m, status:'ok' })), POSTI), judge: fusionEv.judge || preJudge } : null;
    if (chips && (chips.panel.length || chips.judge)) h += fusionChips(chips);
    h += mdLite(acc||'') + (acc?'<span style="color:var(--mut)">▍</span>':dotsHTML());
    live.innerHTML = h; msgsEl.scrollTop = msgsEl.scrollHeight;
  };
  updateLive();

  try {
    // ── sempre via server: Node parla col centralino sullo stesso PC, zero CORS ──
    const payload = { provider, model, messages: outMsgs, web:false, stream:true };
    if (fusionCfg) payload.fusion = fusionCfg;
    // RICHIESTA UTENTE 12/10 sera: se un modello fa «on» al controllo e poi cade PRIMA che la risposta sia iniziata,
    // entra la riserva e si procede (max 2 ricambi: la squadra deve essere completa prima di rispondere).
    // Se invece la risposta è già iniziata non si tocca NIENTE: il pannello lo dice onesto e il prossimo messaggio sostituisce.
    let fixes = 0;
    for (let attempt = 0; ; attempt++){
    let rifaiPre = false; // squadra TUTTA ko con la risposta non ancora iniziata (solo allora si ricompone)
    const nAttesi = (payload.fusion && Array.isArray(payload.fusion.models) && payload.fusion.models.length) ? payload.fusion.models.length : POSTI; // quanti risultati aspettarsi
    const koLive = new Set(); // chi ha già risposto ko in QUESTO giro
    const res = await fetch('/api/chat', { method:'POST', signal:ctrl.signal, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    via = res.headers.get('x-routed-via') || '';
    const ct = res.headers.get('content-type') || '';
    if (!res.ok || ct.includes('application/json')){
      const j = await res.json().catch(()=>({error:{message:'errore sconosciuto'}}));
      throw new Error(j.error?.message || JSON.stringify(j).slice(0,300));
    }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true){
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines){
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          if (j._fusion){
            if (j._fusion.event==='panel' && j._fusion.model){
              fusionEv && fusionEv.panel.push({ model:j._fusion.model, status:j._fusion.status });
              // 12/10 notte (test utente sul focus: «pannello: nessuno · 1 fallito» = risposta buttata via):
              // si ricompone SOLO quando è la SQUADRA INTERA a essere ko. Con 2 vivi su 3 il centralino
              // risponde lo stesso (2 risposte + giudice) e quella risposta NON si butta: il pannello dice chi è caduto.
              const kk = String(j._fusion.model||'').toLowerCase();
              if (!prePanel.length || prePanel.some(x=>sameModel(x, j._fusion.model))){
                if (j._fusion.status && j._fusion.status !== 'ok') koLive.add(kk); else koLive.delete(kk);
              }
              if (fixes < 2 && !acc.trim() && koLive.size >= nAttesi) rifaiPre = true;
            }
            if (j._fusion.event==='judge' && j._fusion.model) fusionEv && (fusionEv.judge = (j._fusion.platform?j._fusion.platform+'/':'')+j._fusion.model);
            const d0 = j.choices?.[0]?.delta?.content || ''; // raro ma possibile: lo stesso pacchetto può portare anche un pezzo di testo
            if (d0) acc += d0;                                // se il testo è partito, la risposta NON si tocca (regola d'oro)
            updateLive();
            if (rifaiPre && !acc.trim()) break; // caduto con risposta non ancora iniziata: si interrompe QUI, senza leggere il resto del pacchetto
            continue;
          }
          if (!servedModel && j.model) servedModel = j.model;
          const d = j.choices?.[0]?.delta?.content || '';
          if (d) acc += d;
          if (j.error) acc += '\n⚠ ' + (j.error.message || '');
        } catch {}
      }
      if (rifaiPre && !acc.trim()){ try { await reader.cancel(); } catch {} break; } // basta così: si ricompone e si riparte (solo a risposta non iniziata)
      updateLive();
    }
      if (ctrl.signal.aborted) return; // stop dell'utente durante il giro
      // ── caduti NEL giro: se la risposta non è mai iniziata, entra la riserva e si procede (12/10 sera) ──
      const koMap = new Map(); // ultimo stato per modello (se il centralino manda eventi doppi, vince l'ultimo); stati assenti non contano
      for (const p of (fusionEv ? fusionEv.panel : [])) koMap.set(String(p.model||'').toLowerCase(), p.status);
      const koPanel = [...koMap].filter(([,s])=>s && s!=='ok');
      const senzaUscita = !acc.trim() || /every panel model failed/i.test(acc); // niente risposta: si può ricomporre senza cancellare nulla
      const cadutoInSquadra = koPanel.some(([m]) => !prePanel.length || prePanel.some(x=>sameModel(x, m)));
      if (fixes < 2 && senzaUscita && (rifaiPre || (koMap.size && cadutoInSquadra))){ // max 2 ricambi, poi si procede col pannello onesto
        markFusionDead(fusionEv.panel);
        const rb = retryBuild ? await retryBuild() : null; // squadra ricomposta: i vivi restano, i posti liberi dalla coda
        if (ctrl.signal.aborted) return; // stop dell'utente durante la ricomposizione: si esce puliti, senza toccare nulla
        const rmod = Array.isArray(rb) ? rb : (rb && rb.models);
        const cambiata = !!(rmod && rmod.length && rmod.some(m=>!prePanel.some(x=>sameModel(x, m)))); // se non entra nessun modello NUOVO il ricambio non serve
        if (rmod && rmod.length >= 2 && cambiata){
          try { // i contatori non perdono il giro buttato: le chiamate sono state fatte davvero
            for (const p of fusionEv.panel){ bumpUsage('call:'+p.model, 1); if (p.status==='ok') countQuota(p.model, 1); }
            if (fusionEv.judge){ bumpUsage('call:'+fusionEv.judge, 1); countQuota(fusionEv.judge, 1); }
          } catch {}
          fixes++;
          draft = acc; // se il giro rifatto non produce nulla, torna il testo del primo (l'errore, se c'era)
          acc = '';
          servedModel = '';
          fusionEv.panel = []; fusionEv.judge = null;
          prePanel = rmod; preJudge = Array.isArray(rb) ? null : (rb.judge || null); // i chip mostrano la squadra nuova
          payload.fusion = Array.isArray(rb) ? { models:rmod, expose_panel:true } : { models:rmod, expose_panel:true, ...(rb.judge?{judge:rb.judge}:{}) };
          updateLive();
          continue;
        }
      }
      break;
    }
    if (!acc.trim() && draft) acc = draft; // il giro rifatto non ha prodotto nulla: torna il primo testo
    if (!acc.trim() || /every panel model failed/i.test(acc)){ // nessuna uscita dopo i ricambi (o solo la riga del centralino): MAI una bolla vuota — la nota dice cosa è successo (12/10 notte)
      markFusionDead(fusionEv ? fusionEv.panel : []);
      const caduti = fusionEv && fusionEv.panel.length ? ' (caduti: ' + fusionEv.panel.map(p=>shortName(p.model)).join(', ') + ')' : '';
      c.msgs.push({ role:'error', content:'nessun modello della squadra ha risposto in questo giro' + caduti + ': restano segnati e rientrano da soli appena rispondono — riprova tra poco (o cambia modello).' });
      saveChats(); renderChat();
      return;
    }
    c.msgs.push({ role:'assistant', content:acc, model: servedModel || dispModel, sel: dispModel, via, web: !!(webOn && turnSources), webq: webTentata ? String(q||'').slice(0,90) : '', webok: !!(turnSources&&turnSources.length), god, trading: tradingAuto, tailor: dispModel==='tailor', team: tailorTeam || undefined, sources: turnSources, fusion: fusionEv && fusionEv.panel.length ? { panel: panelMostra(fusionEv.panel, POSTI), judge: fusionEv.judge, judgePinned: fusionEv.judge ? null : (preJudge || null) } : null });
    if(fusionEv) suntoFusion(c.msgs[c.msgs.length-1]);   // squadra: se la risposta e' lunga, il sunto si prepara da solo
  } catch (e) {
    if (e.name === 'AbortError'){ if (acc) c.msgs.push({ role:'assistant', content:acc, model: servedModel || dispModel, sel: dispModel, via, web: !!(webOn && turnSources), webq: webTentata ? String(q||'').slice(0,90) : '', webok: !!(turnSources&&turnSources.length), god, trading: tradingAuto, tailor: dispModel==='tailor', team: tailorTeam || undefined, sources: turnSources, fusion: fusionEv && fusionEv.panel.length ? { panel: panelMostra(fusionEv.panel, POSTI), judge: fusionEv.judge, judgePinned: fusionEv.judge ? null : (preJudge || null) } : null }); } // stop a vuoto: nessun messaggio
    else { c.msgs.push({ role:'error', content: e.message }); }
  } finally {
    ctrl = null; uiBusy(false); // ■ stop → torna Invia al suo posto
    const lastm = c.msgs[c.msgs.length-1];
    if (lastm && lastm.role === 'assistant'){
      bumpUsage('combo:' + provider + '/' + dispModel, 1);
      if (lastm.fusion){
        for (const p of lastm.fusion.panel) bumpUsage('call:' + p.model, 1);
        if (lastm.fusion.judge) bumpUsage('call:' + lastm.fusion.judge, 1);
      } else if (lastm.model){
        bumpUsage('call:' + lastm.model, 1);
      }
      if (lastm.fusion){ // le riuscite contano sulla quota del giorno (i fallite no: rifiutate = non consumate)
        for (const p of lastm.fusion.panel) if (p.status==='ok') countQuota(p.model, 1);
        if (lastm.fusion.judge) countQuota(lastm.fusion.judge, 1);
      } else if (lastm.model){ countQuota(lastm.model, 1); }
    }
    touch(c); saveChats(); renderSidebar(); renderChat();
    if (fusionEv && fusionEv.panel.length) markFusionDead(fusionEv.panel);
  }
}

async function callModel(model, sysStack, userContent, comboLabel){
  const key = getKey('routerhub') || 'locale';
  if (model==='vision') model = 'auto';
  else if (model==='docs') model = 'auto:smart';
  let fusionCfg = null;
  let disp = model;
  if (model && typeof model === 'object' && Array.isArray(model.models)){ // squadra pronta (focus): riserve e giudice gi\u00e0 applicati
    fusionCfg = { models: model.models, expose_panel: true };
    if (model.judge) fusionCfg.judge = model.judge;
    model = 'fusion'; disp = 'fusion';
  }
  if (model==='code' || model==='trading'){
    const isTr = model==='trading';
    const panel = await getFusionPanel(isTr ? SQUADRA_TRADING : SQUADRA_CODE, isTr ? 'fh_tradingpanel' : 'fh_codepanel');
    fusionCfg = panel ? { models: panel, expose_panel: true } : { expose_panel: true };
    if (panel){ const gj = await prendiGiudice(isTr ? 'trading' : 'code', isTr ? GIUDICE_TRADING : GIUDICE_CODE, (await getCatalogIds()) || []); if (gj) fusionCfg.judge = gj; } // anche qui il giudice è pinnato (0 chiamate se è già in memoria)
    model = 'fusion';
  } else if (model==='tailor'){
    const p = await pickTailorPanel(userContent);
    if (p){ fusionCfg = { models: p.cfg.models, expose_panel: true }; if (p.cfg.judge) fusionCfg.judge = p.cfg.judge; }
    else fusionCfg = { expose_panel: true };
    model = 'fusion';
  } else if (model.startsWith('team::')){
    const t = getTeams().find(x=>x.name===model.slice(6));
    if (t){ const cfg = applyTeamWithReserves(t, (await getCatalogIds()) || []); fusionCfg = { models: cfg.models, expose_panel: true }; if (cfg.judge) fusionCfg.judge = cfg.judge; }
    else fusionCfg = { expose_panel: true };
    model = 'fusion';
  } else if (model==='fusion' && !fusionCfg){ // !fusionCfg: la squadra pronta (focus) non va sovrascritta
    fusionCfg = { expose_panel: true };
  }
  const messages = [...sysStack.map(s=>({role:'system',content:s})), {role:'user',content:userContent}];
  const payload = { provider:'routerhub', model, messages, web:false, stream:false };
  if (fusionCfg) payload.fusion = fusionCfg;
  const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  if (!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.error?.message || ('HTTP '+res.status)); }
  const j = await res.json();
  bumpUsage('combo:'+comboLabel, 1);
  const f = j._fusion;
  if (f && Array.isArray(f.panel)) markFusionDead(f.panel);
  if (f && Array.isArray(f.panel)){ for (const p of f.panel) bumpUsage('call:'+(p.model||'?'), 1); if (f.judge && f.judge.model) bumpUsage('call:'+f.judge.model, 1); }
  else bumpUsage('call:'+disp, 1);
  if (f && Array.isArray(f.panel)){ for (const p of f.panel) if (p.status==='ok') countQuota(p.model, 1); if (f.judge && f.judge.model) countQuota(f.judge.model, 1); }
  else if (j.model) countQuota(j.model, 1);
  return (j.choices?.[0]?.message?.content || '').trim();
}

async function streamCall(payload, onChunk, stopWhen){ // fusion in streaming con eventi pannello/giudice (per 🔍 focus)
  const key = getKey('routerhub') || 'locale';
  const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const ct = res.headers.get('content-type') || '';
  if (!res.ok || ct.includes('application/json')){
    const j = await res.json().catch(()=>({}));
    throw new Error((j.error && j.error.message) || ('HTTP '+res.status));
  }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '', acc = '', stopped = false;
  while (true){
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines){
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') continue;
      try {
        const j = JSON.parse(data);
        if (onChunk) onChunk(j);
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content || '';
        if (d) acc += d; // prima di qualunque interruzione: out.txt non deve perdere testo già arrivato
        if (stopWhen && stopWhen(j)){ stopped = true; try { await reader.cancel(); } catch {} break; } // interruzione voluta (ricomposizione): niente altro testo da leggere
        if (j.error) acc += '\n⚠ ' + (j.error.message || '');
      } catch {}
    }
    if (stopped) break;
  }
  return { txt: acc, stopped };
}

// 📝 se la fusion risponde lungo, il sunto arriva da solo (le cose importanti), senza toccare la risposta
const SOGLIA_SUNTO = 1200;   // caratteri: sotto questa lunghezza non serve
async function suntoFusion(m){
  if(!m || m.role!=='assistant' || m.sunto) return;
  const testo = String(m.content || '');
  if(testo.length < SOGLIA_SUNTO) return;
  try {
    const out = await callModel('auto:fast', [SUM_SYS], 'Risposta da riassumere:\n' + testo.slice(0, 12000), '📝 in breve');
    if(out && out.trim()){ m.sunto = out.trim(); saveChats(); renderChat(); }
  } catch(e){ /* se il sunto non riesce resta la risposta intera: nessun errore a schermo */ }
}

  const base = 'Domanda originale:\n' + (q||'(non trovata)') + '\n\nRisposta del modello:\n' + m.content.slice(0, 12000);

  const setLive = (t) => { live.innerHTML = '<div class="who">'+t+'</div><i style="color:var(--mut)">…</i>'; msgsEl.appendChild(live); msgsEl.scrollTop = msgsEl.scrollHeight; };
  try {
    if (kind==='sum'){
      setLive('📝 riassunto in arrivo');
      const out = await callModel('auto:fast', [SUM_SYS], base, '📝 riassunto');

    } else if (kind==='mosse'){

    } else if (kind==='focus'){
      setLive('🔍 focus: scelgo la squadra di verifica');
      const brief = 'VERIFICA CRITICA E RICERCA PROFONDA della risposta di un modello AI.\nDomanda:\n' + (q||'(non trovata)') + '\n\nRisposta da verificare:\n' + m.content.slice(0, 1500);
      // il CONTEGGIO anche qui (richiesta utente 12/10): durante la verifica si vede «verificati X / N» coi pallini,
      // poi la squadra in VERDE + giudice e si parte — la verifica non si mostra, il risultato sì.

      const focusComp = ()=>{ live.innerHTML = '<div class="who">🔍 focus — scelgo la squadra di verifica</div>' + (fprog ? '<span class="vcount">verificati '+fprog.done+' / '+fprog.total+'</span>' : '') + dotsHTML(); msgsEl.scrollTop = msgsEl.scrollHeight; };
      const p = await pickTailorPanel(brief, FOCUS_SEL_SYS, undefined, (d,t)=>{ fprog = { done:d, total:t }; focusComp(); }, 'focus');
      let team = p ? p.cfg : null; // 3 titolari + riempimento riserve + giudice/giudice riserva (POSTI)
      const fusionEv = { panel: [], judge: null };
      let preTeam = team ? { panel: team.models.map(mm=>({ model:mm, status:'ok' })), judge: team.judge || null } : null; // i verificati (usati solo se il centralino non manda il suo pannello)
      let acc = '';
      const upd = ()=>{ // pannello live COME nelle fusion in chat: SOLO i modelli reali, max POSTI (3) + giudice (niente doppioni/extra)
        let hh = '<div class="who">🔍 focus' + (team && team.models ? ' — verifica con ' + team.models.length + ' modelli' : '') + '</div>';
        const ev = fusionEv.panel.length ? panelMostra(fusionEv.panel, POSTI) : (preTeam ? panelMostra(preTeam.panel, POSTI) : []);
        const chips = ev.length ? { panel: ev, judge: fusionEv.judge || (preTeam ? preTeam.judge : null) } : null;
        if (chips) hh += fusionChips(chips);
        hh += mdLite(acc||'') + (acc ? '<span style="color:var(--mut)">▍</span>' : dotsHTML());
        live.innerHTML = hh; msgsEl.appendChild(live); msgsEl.scrollTop = msgsEl.scrollHeight;
      };
      upd();
      const stack = [];
      if ($('god').checked) stack.push(GOD_SYS);
      if (m.trading) stack.push(TRADING_SYS); // l'originale era trading: la verifica resta da analista finanziario
      stack.push(FOCUS_SYS);
      const fpay = { provider:'routerhub', model:'fusion', web:false, stream:true, messages:[...stack.map(s=>({role:'system',content:s})), {role:'user',content:base}], fusion: team ? { models: team.models, expose_panel: true, ...(team.judge ? { judge: team.judge } : {}) } : { expose_panel: true } };
      let txt = '', prepend = '', draftF = '';
      let fixes = 0; // come in chat: max 2 ricambi, e SOLO prima che la risposta sia iniziata (richiesta utente 12/10 sera)
      const nFocus = (fpay.fusion && Array.isArray(fpay.fusion.models) && fpay.fusion.models.length) ? fpay.fusion.models.length : POSTI;
      for (let attempt = 0; ; attempt++){
        acc = prepend;
        let rifaiPre = false;
        const koLiveF = new Set(); // chi ha già risposto ko in questo giro (stessa regola della chat: si ricompone solo se è ko TUTTA la squadra)
        const out = await streamCall(fpay, (j)=>{
          if (j._fusion){
            if (j._fusion.event==='panel' && j._fusion.model){
              fusionEv.panel.push({ model:j._fusion.model, status:j._fusion.status });
              const kk = String(j._fusion.model||'').toLowerCase();
              if (!team || !team.models || team.models.some(x=>sameModel(x, j._fusion.model))){
                if (j._fusion.status && j._fusion.status !== 'ok') koLiveF.add(kk); else koLiveF.delete(kk);
              }
              if (fixes < 2 && !acc.trim() && koLiveF.size >= nFocus) rifaiPre = true;
            }
            if (j._fusion.event==='judge' && j._fusion.model) fusionEv.judge = (j._fusion.platform?j._fusion.platform+'/':'')+j._fusion.model;
          }
          const dd = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (dd) acc += dd; // il testo scorre pure lui, come nelle fusion in chat
          upd();
        }, (j)=> rifaiPre && !String(acc||'').trim() && !!(j && j._fusion && j._fusion.event==='panel')); // solo se la risposta non è ancora iniziata
        // caduti NEL giro: se la risposta non è mai iniziata, entra la riserva e si procede
        const koMap = new Map(); // ultimo stato per modello (eventi doppi: vince l'ultimo); stati assenti non contano
        for (const x of fusionEv.panel) koMap.set(String(x.model||'').toLowerCase(), x.status);
        const koPanel = [...koMap].filter(([,s])=>s && s!=='ok');
        const senzaUscita = !String(acc||'').trim() || /every panel model failed/i.test(acc);
        const cadutoInSquadra = koPanel.some(([m]) => !team || !team.models || team.models.some(x=>sameModel(x, m)));
        if (fixes < 2 && senzaUscita && (rifaiPre || (koMap.size && cadutoInSquadra)) && p && p.team){ // max 2 ricambi, poi si procede onesti
          markFusionDead(fusionEv.panel);
          const ids2 = (await getCatalogIds()) || [];
          const rb0 = applyTeamWithReserves(p.team, ids2);
          const squad2 = [...(rb0.models||[]), ...((p.team && p.team.reserves)||[])];
          const rb = { models: await prendiSquadraViva('focus', squad2, ids2, undefined), judge: rb0.judge }; // coda ripresa: i sostituti arrivano da lì
          const cambiata = !!(rb.models && rb.models.some(mm=>!(team && team.models || []).some(x=>sameModel(x, mm)))); // serve un modello NUOVO
          if (rb.models && rb.models.length >= 2 && cambiata){
            fixes++;
            draftF = acc; // se il giro rifatto non produce nulla, torna il testo del primo
            try { // i contatori non perdono il giro buttato: le chiamate sono state fatte davvero
              for (const pm of fusionEv.panel){ bumpUsage('call:'+pm.model, 1); if (pm.status==='ok') countQuota(pm.model, 1); }
              if (fusionEv.judge){ bumpUsage('call:'+fusionEv.judge, 1); countQuota(fusionEv.judge, 1); }
            } catch {}
            fusionEv.panel = []; fusionEv.judge = null;
            team = rb; // anche la riga live dice la squadra giusta
            preTeam = { panel: rb.models.map(mm=>({ model:mm, status:'ok' })), judge: rb.judge || null };
            fpay.fusion = { models: rb.models, expose_panel: true, ...(rb.judge ? { judge: rb.judge } : {}) };
            upd();
            continue;
          }
        }
        txt = prepend + (out && out.txt !== undefined ? out.txt : out);
        break;
      }
      if (!String(txt||'').trim() && draftF) txt = draftF; // il giro rifatto non ha prodotto nulla: torna il primo testo
      markFusionDead(fusionEv.panel);
      if (!String(txt||'').trim() || /every panel model failed/i.test(txt)) throw new Error('il focus non ha prodotto una risposta: gli analisti sono caduti in partita' + (fusionEv.panel.length ? ' (caduti: ' + fusionEv.panel.map(p=>shortName(p.model)).join(', ') + ')' : '') + ' — i caduti restano segnati e rientrano da soli appena rispondono: riprova tra poco'); // mai un messaggio vuoto
      bumpUsage('combo:🔍 focus', 1);
      for (const pm of fusionEv.panel) bumpUsage('call:'+pm.model, 1);
      if (fusionEv.judge) bumpUsage('call:'+fusionEv.judge, 1);
      for (const pm of fusionEv.panel) if (pm.status==='ok') countQuota(pm.model, 1);
      if (fusionEv.judge) countQuota(fusionEv.judge, 1);
      c.msgs.push({ role:'assistant', content: txt, model:'🔍 focus (di '+shortName(m.model)+')', derived:'focus', fusion: fusionEv.panel.length ? { panel: panelMostra(fusionEv.panel, POSTI), judge: fusionEv.judge, judgePinned: fusionEv.judge ? null : (preTeam ? preTeam.judge : null) } : null });
    }
  } catch (e) {
    c.msgs.push({ role:'error', content: 'Non riuscito: ' + e.message });
  } finally {
    live.remove();
    touch(c); saveChats(); renderChat();
  }
}

function lastTargetIdx(){
  const c = cur(); if (!c) return -1;
  for (let k=c.msgs.length-1; k>=0; k--){ const m=c.msgs[k]; if (m.role==='assistant' && m.content && !m.derived) return k; }
  return -1;
}

async function deriveLast(kind){
  if (deriving || ctrl) return;

  deriving = true; updateBarBtns();

}

// ══════════ 🎯 fusion su misura: il selettore compone la squadra in base al compito ══════════
const TAILOR_SYS = "Sei il selezionatore di una squadra di modelli AI. Ti vengono dati un COMPITO e il POOL dei modelli utilizzabili (un id per riga, con accanto il numero di FORNITORI: più fornitori = più robusto). Scegli i 3 modelli MIGLIORI per quel compito specifico — codice: i più forti col codice; analisi, mercati, numeri: i migliori col ragionamento; scrittura e idee: i migliori col testo; multimodale o altro: i più adatti — preferendo approcci diversi tra loro e, a parità di qualità, quelli con PIÙ fornitori. Poi 4 RISERVE di qualità simile (subentrano se un titolare finisce i crediti o salta), poi il GIUDICE migliore per valutare e riscrivere le risposte di quel compito e un GIUDICE RISERVA. Regole: scegli modelli con 2 O PIÙ fornitori; un modello con 1 fornitore va bene SOLO se è l'unico adatto al compito; usa SOLO id presenti nel pool, copiali ESATTI come sono, niente commenti; in tutta la squadra al massimo 2 modelli marcati electronhub. Rispondi SOLO con questo formato:\\nPANNELLO:\\n<id>\\n<id>\\n<id>\\nRISERVE:\\n<id>\\n<id>\\n<id>\\n<id>\\nGIUDICE:\\n<id>\\nGIUDICE RISERVA:\\n<id>";
function matchCatalogId(cand, ids){
  const c = String(cand||'').trim().toLowerCase().replace(/[*_`"'<>]/g,''); // il selettore a volte ingrassa/incornicia i nomi
  if (!c) return null;
  for (const id of ids){ if (String(id).toLowerCase()===c) return id; }
  for (const id of ids){ const s = String(id).toLowerCase(); if (s.endsWith('/'+c) || s.split('/').pop()===c) return id; }
  return null;
}
function parseTailor(out, ids){
  const models = [], reserves = []; let judge = null, judgeReserve = null, mode = 0;
  for (const raw of String(out||'').split('\n')){
    const ln = raw.trim(); if (!ln) continue;
    const flat = ln.toLowerCase().replace(/[:\s*_#>.]/g,''); // anche **PANNELLO** in grassetto vale
    if (flat==='pannello'){ mode=1; continue; }
    if (flat==='riserve'){ mode=2; continue; }
    if (flat==='giudice'){ mode=3; continue; }
    if (flat==='giudiceriserva'){ mode=4; continue; }
    const cand = ln.replace(/^\d+[.)]\s*/,'').replace(/^[-*]\s+/,'').trim();
    const full = matchCatalogId(cand, ids);
    if (!full) continue;
    if (mode===1 && models.length<POSTI && !models.includes(full) && !reserves.includes(full)) models.push(full);
    else if (mode===2 && reserves.length<4 && !models.includes(full) && !reserves.includes(full)) reserves.push(full);
    else if (mode===3 && !judge && !models.includes(full)) judge = full;
    else if (mode===4 && !judgeReserve && !models.includes(full) && full!==judge) judgeReserve = full;
  }
  return models.length>=2 ? { models, reserves, judge, judgeReserve } : null; // meno di 2 validi → si viaggia in fusion auto
}
async function getCatalogIds(){
  try {
    const cacheKey = 'fh_tailorcat_router'; // cache distinto: non riusa ID del vecchio catalogo esterno
    try {
      const cache = sessionStorage.getItem(cacheKey);
      if (cache){ const j = JSON.parse(cache); if (Date.now()-j.t < 5*60*1000 && Array.isArray(j.ids) && j.ids.length) return j.ids; }
    } catch {}
    const r = await fetch('/api/modelli');
    if (!r.ok) return null;
    const j = await r.json();
    const ids = (j.data||[]).map(m=>m && (m.id && m.modello ? m.id+'/'+m.modello : m.modello||m.id)).filter(Boolean);
    if (!ids.length) return null;
    try { sessionStorage.setItem(cacheKey, JSON.stringify({t:Date.now(), ids})); } catch {}
    return ids;
  } catch { return null; }
}
// chi non c'è più (crediti finiti, cooldown) salta ed entra la riserva — giudice compreso
function markFusionDead(panel){ // chi è fallito in una fusion viene ricordato 15 minuti — e la memoria sta nel BROWSER: sopravvive al riavvio (chi ce l'ha fatta viene riabilitato)
  try {
    const dead = JSON.parse(lsGet('fh_fusedead')||'{}'); const now = Date.now();
    for (const p of (panel||[])){
      const k = String(p.model||'').toLowerCase(); if (!k) continue;
      if (p.status && p.status!=='ok') dead[k] = now; else delete dead[k];
    }
    lsSet('fh_fusedead', JSON.stringify(dead));
  } catch {}
}
function fusionDead(){
  try { const dead = JSON.parse(lsGet('fh_fusedead')||'{}'); const now = Date.now(); return new Set(Object.keys(dead).filter(k=>now-dead[k] < 15*60*1000)); } catch { return new Set(); }
}
// ── la panchina QUOTA: i Gemini 3.x flash via AI Studio hanno 20 richieste/giorno, la quota torna alle 9:00 ──
// (mezzanotte ora Pacifica = 09:00 in Italia, fisse tutto l'anno — l'utente vive in Italia: l'ora locale del browser è quella giusta)
function quotaDayKey(){ const d = new Date(Date.now() - 9*60*60*1000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } // il «giorno quota» cambia alle 9:00, non a mezzanotte
function quotaRPD(id){ return (/^gemini/.test(String(id)) && /flash/.test(String(id)) && !/lite/.test(String(id))) ? 20 : 0; } // 20/giorno i Gemini 3.x flash; i flash-lite (500) e gli altri non si panchinano
function dayUse(){
  try {
    const j = JSON.parse(lsGet('fh_dayuse')||'{}');
    if (j.d === quotaDayKey() && j.n && typeof j.n === 'object') return j.n;
  } catch {}
  return {}; // giorno quota nuovo (passate le 9) o mai contato: si riparte da zero
}
function countQuota(id, k){
  if (!quotaRPD(id)) return; // solo chi ha il tetto giornaliero
  const n = dayUse(); const kk = String(id).toLowerCase();
  n[kk] = (n[kk]||0) + (k||1);
  lsSet('fh_dayuse', JSON.stringify({ d: quotaDayKey(), n }));
}
function quotaBench(){ // chi ha bruciato le 20 di oggi: in panchina fino alle 9:00 di domani
  const n = dayUse(); const out = new Set();
  for (const k of Object.keys(n)) if (n[k] >= quotaRPD(k)) out.add(k); // quotaRPD=0 → mai in panchina
  return out;
}
function quotaBenchInfo(){ // per il popup 📊: chi è in panchina, quante ne ha usate e quando rientra
  const bench = quotaBench(); if (!bench.size) return [];
  const n = dayUse();
  return [...bench].sort().map(k => shortName(k) + ' … ' + (n[k]||0) + '/20 usate');
}
// ── la verifica «ci sei?»: si chiede a chi serve, quando serve (12/10 sera — vedi prendiSquadraViva) ──
// prima del primo giro si verificano SOLO i POSTI della squadra (3, mai tutto il catalogo); ai messaggi successivi
// rientrano i verificati di poco fa e si pinga solo chi deve sostituire un caduto, riprendendo la coda da dove si era
// i tre pallini animati: la finestra di risposta li mostra SUBITO, così si vede che il sistema lavora (richiesta utente 12/10)
function dotsHTML(){ return '<span class="dots" aria-label="caricamento"><i></i><i></i><i></i></span>'; }
// segnale combinato: timeout del ping + eventuale STOP dell'utente (tasto ■ stop)
function comboSig(ms, ext){
  let t = null; try { t = AbortSignal.timeout(ms || 30000); } catch {}
  try { if (ext && t && AbortSignal.any) return AbortSignal.any([ext, t]); } catch {}
  return ext || t;
}
async function pingAlive(id, ms, ext){
  // Stato dalla cache/appello locale: non invia una richiesta LLM di prova.
  try {
    const r=await fetch('/api/modelli',{cache:'no-store',signal:comboSig(ms||8000,ext)});
    if(!r.ok) return false;
    const j=await r.json();
    const norm=x=>String(x||'').toLowerCase();
    const target=norm(id);
    return (j.data||[]).some(m=>{
      const full=norm(m.id&&m.modello?m.id+'/'+m.modello:(m.modello||m.id));
      return (full===target || full.endsWith('/'+target) || target.endsWith('/'+full)) && m.stato==='risponde';
    });
  } catch { return false; }
}
// (12/10 sera: i «rinforzi» e il «provino» non sono più funzioni a sé — la squadra viva e la coda
//  titolari→riserve→rinforzi vivono dentro prendiSquadraViva: si pingano SOLO i posti liberi, mai tutto il catalogo)
const RINFORZI = ['qwen3.8-27b','gpt-oss-120b','gpt-oss-20b','nemotron-3-super-120b','nemotron-3.5-lightning','nemotron-3-ultra-550b','gemma-4-31b','north-mini-code','codestral','mistral-code','glm-4.7-flash','gemini-3.5-flash','deepseek-v4-flash','muse-glimmer-30b']; // ultima spiaggia: solo multi-fornitore o capienti (dati 12/10)
// il richiamo del caduto: quando la coda finisce e la squadra è incompleta, chi risultava giù viene richiamato — se è tornato su, rientra
async function refreshDead(ext){
  const dead = fusionDead();
  if (!dead.size) return 0;
  const lista = [...dead].filter(m=>!quotaBench().has(String(m).toLowerCase())); // i «quota finita» rientrano alle 9:00, non prima
  if (!lista.length) return 0;
  const esiti = await Promise.all(lista.map(m=>pingAlive(m, 10000, ext)));
  if (ext && ext.aborted) return 0; // annullato: nessuno viene segnato
  markFusionDead(lista.map((m,k)=>({ model:m, status: esiti[k] ? 'ok' : 'failed' })));
  return esiti.filter(Boolean).length; // quanti sono tornati su
}
function applyTeamWithReserves(t, ids){
  const avail = new Set(ids.map(x=>String(x).toLowerCase()));
  const dead = fusionDead();
  const bench = quotaBench(); // quota finita → panchina fino alle 9:00, anche nel fallback: ritentarla è un 429 sicuro
  const build = (useDead)=>{
    const okId = id => avail.has(String(id).toLowerCase()) && (!useDead || !dead.has(String(id).toLowerCase())) && !bench.has(String(id).toLowerCase());
    const models = [];
    for (const m of (t.models||[])) if (okId(m) && !models.includes(m)) models.push(m);
    for (const r of (t.reserves||[])){ if (models.length>=POSTI) break; if (okId(r) && !models.includes(r)) models.push(r); }
    let judge = null;
    for (const j of [t.judge, t.judgeReserve]){ if (j && okId(j) && !models.includes(j)){ judge = j; break; } }
    return { models: models.slice(0,POSTI), judge };
  };
  let out = build(true);
  if (out.models.length < 2) out = build(false); // troppi segnati morti → meglio riprovarli che partire vuoti
  return out;
}
// ── LA SQUADRA VIVA (richiesta utente 12/10 sera) ─────────────────────────────────────────────
// «appena trovi i modelli + il giudice stoppa la richiesta e parti; se uno cade nel messaggio
// successivo riprendi le chiamate da dove eri arrivato e metti in squadra il prossimo on».
// Quindi: la squadra verificata resta in memoria (per chat+modalità, 6 ore); a ogni messaggio
// rientra SENZA riping (i vivi di poco fa sono vivi) e si pingano SOLO i posti liberi pescando
// dalla coda da dove si era rimasti: titolari+riserve non ancora testati, poi i rinforzi del
// catalogo. Zero chiamate quando è tutto a posto, una quando serve un sostituto.
function sqKey(selKey){ const c = (typeof cur === 'function') ? cur() : null; return 'fh_sq_' + ((c && c.id) || 'x') + '_' + selKey; }
function sqRec(selKey){
  try {
    const j = JSON.parse(lsGet(sqKey(selKey)) || 'null');
    if (j && Array.isArray(j.vivi) && j.vivi.length >= 2 && (Date.now() - (j.t || 0)) < 6*3600*1000) return j; // memoria vecchia → si ricompone
  } catch {}
  return null;
}
function sqSave(selKey, vivi, extra){
  try { lsSet(sqKey(selKey), JSON.stringify(Object.assign({ vivi, t: Date.now() }, extra || {}))); } catch {}
}
// ── IL GIUDICE CON LE SUE RISERVE (richiesta utente 12/10 sera) ──────────────────────────────
// Il centralino gira il giudice PINNATO al modello che gli diamo (config.judge): se il primo è
// caduto si pesca la riserva, in ordine. Anche il giudice fa la sua chiamatina «ci sei?» quando
// serve (fa parte della squadra: «prima di dare la risposta voglio la certezza che la squadra
// funzioni»), poi resta in memoria 6h: al messaggio dopo non si ripinga.
function gjKey(selKey){ const c = (typeof cur === 'function') ? cur() : null; return 'fh_gj_' + ((c && c.id) || 'x') + '_' + selKey; }
async function prendiGiudice(selKey, cands, ids, ext){
  const norm = s => String(s || '').toLowerCase();
  try {
    const rec = JSON.parse(lsGet(gjKey(selKey)) || 'null');
    if (rec && rec.j && (Date.now() - (rec.t||0)) < 6*3600*1000){
      const m = smartResolve(rec.j, ids||[]);
      if (m && !fusionDead().has(norm(m)) && !quotaBench().has(norm(m))) return m; // giudice di poco fa, ancora vivo: 0 chiamate
    }
  } catch {}
  for (const want of (cands||[]).filter(Boolean)){
    const m = smartResolve(want, ids||[]);
    if (!m || fusionDead().has(norm(m)) || quotaBench().has(norm(m))) continue;
    const vivo = await pingAlive(m, 10000, ext);
    if (ext && ext.aborted) return null; // stop dell'utente: nessuno segnato
    if (vivo){ try { lsSet(gjKey(selKey), JSON.stringify({ j:m, t:Date.now() })); } catch {} return m; }
    markFusionDead([{ model:m, status:'failed' }]); // caduto: la prossima volta si parte dalla riserva
  }
  return null; // nessun giudice vivo: si va avanti lo stesso (il centralino fa «il migliore singolo»), il chip lo dice onesto
}
async function prendiSquadraViva(selKey, squad, ids, ext, onProg, extra){
  const norm = s => String(s || '').toLowerCase();
  let dead = fusionDead(); const bench = quotaBench();
  const ok = m => m && ids.some(x=>norm(x)===norm(m)) && !dead.has(norm(m)) && !bench.has(norm(m));
  const out = [];
  const mem = sqRec(selKey) || {};
  for (const m of (mem.vivi || [])) if (ok(m) && !out.includes(m) && out.length < POSTI) out.push(m); // i vivi dell'ultimo giro rientrano senza un'altra chiamata
  let planned = POSTI - out.length; // il CONTEGGIO: solo i posti da riempire (non tutto il catalogo)
  if (onProg && planned > 0) onProg(0, planned); // squadra già completa e viva → nessuna verifica da mostrare
  let pingati = 0;
  // 1° giro: titolari+riserve · 2° giro (dopo il richiamo dei caduti): chi è tornato su rientra · 3° giro: rinforzi dal catalogo
  const pools = [ squad || [], squad || [], RINFORZI ];
  for (let g = 0; g < pools.length && out.length < POSTI; g++){
    if (g === 1){ await refreshDead(ext); dead = fusionDead(); } // coda passata: si richiamano i caduti e si RIPROVA la squadra — chi è tornato su rientra (dead riletta: il richiamo l'ha appena aggiornata)
    if (ext && ext.aborted) return out;
    const pool = [];
    for (const want of pools[g]){ const m = smartResolve(want, ids); if (ok(m) && !out.includes(m) && !pool.includes(m)) pool.push(m); }
    let i = 0;
    while (out.length < POSTI && i < pool.length){
      const round = pool.slice(i, i + (POSTI - out.length)); i += round.length;
      const esiti = await Promise.all(round.map(m=>pingAlive(m, 10000, ext)));
      if (ext && ext.aborted) return out; // stop dell'utente: nessuno viene segnato, si parte con chi c'è
      pingati += round.length;
      markFusionDead(round.map((m,k)=>({ model:m, status: esiti[k] ? 'ok' : 'failed' })));
      for (let k=0; k<round.length; k++) if (esiti[k] && out.length < POSTI) out.push(round[k]);
      planned = pingati + (POSTI - out.length); // un ping andato a vuoto = una chiamata in più: il totale cresce
      if (onProg) onProg(pingati, planned);
    }
  }
  if (out.length >= 2) sqSave(selKey, out, extra); // salvata per il messaggio successivo
  return out;
}
async function pickTailorPanel(taskText, selSys, ext, onProg, selKey){
  try {
    const key = getKey('routerhub') || 'locale';
    const ids = await getCatalogIds(); if (!ids) return null;
    const k = selKey || 'tailor';
    const mem = sqRec(k);
    if (mem && mem.squad && mem.squad.length){ // squadra già scelta per questo compito e verificata poco fa: si riprende da lì (0 chiamate se è tutta viva)
      const vivi = await prendiSquadraViva(k, mem.squad, ids, ext, onProg, { squad: mem.squad, judge: mem.judge || null });
      if (vivi.length >= 2){ const cfg = { models: vivi, judge: mem.judge || null }; return { team: { models: vivi, judge: mem.judge || null, reserves: mem.squad }, cfg }; }
    }
    // POOL CURATO (12/10 sera): prima si passavano i primi 80 id del catalogo GREZZI — dentro c'erano i
    // sail «payment required» e i 20/giorno: il selettore li sceglieva e al ping cadeva tutto. Ora vede
    // solo modelli utilizzabili, col numero di fornitori accanto (tanti fornitori = regge di più).
    const lista = (()=>{
      const out = [];
      for (const [want, forn] of POOL_SELEZIONE){ const m = smartResolve(want, ids); if (m && !out.some(x=>x.m===m)) out.push({ m, forn }); }
      const eh = new Set(['gpt-5.6-luna','deepseek-v4-flash','minimax-m3','qwen3.8-flash']); // electronhub: un solo credito settimanale condiviso
      return out.map(x=>x.m+'  ('+x.forn+' fornitori'+(eh.has(x.m.split('/').pop())?' · electronhub, credito unico':'')+')').join('\n');
    })();
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ provider:'routerhub', model:'auto:fast', web:false, stream:false, messages:[{role:'system',content: selSys || TAILOR_SYS},{role:'user',content:'COMPITO:\n'+String(taskText||'').slice(0,2000)+'\n\nCATALOGO dei modelli disponibili (un id per riga):\n'+lista}] }) });
    if (!res.ok) return null;
    const j = await res.json();
    bumpUsage('combo:🎯 selezione fusion', 1); bumpUsage('call:auto:fast', 1);
    const team = parseTailor(j.choices?.[0]?.message?.content, ids);
    if (!team) return null;
    let cfg = applyTeamWithReserves(team, ids);
    try { // verifica: si pingano solo i posti liberi dai titolari+riserve scelti, poi i rinforzi (12/10 sera)
      const squad = [...(team.models||[]), ...(team.reserves||[])];
      const pr = await prendiSquadraViva(k, squad, ids, ext, onProg, { squad, judge: cfg.judge || null });
      if (pr && pr.length >= 2) cfg = { models: pr, judge: cfg.judge };
    } catch {}
    try { // anche il GIUDICE viene verificato, con le sue riserve in ordine (12/10 sera): chip sempre visibile, e se firma lo dice il centralino
      const gj = await prendiGiudice(k, [cfg.judge, team.judgeReserve].filter(Boolean), ids, ext);
      if (gj) cfg = { models: cfg.models, judge: gj };
    } catch {}
    return { team, cfg };
  } catch (e) { console.error('pickTailorPanel:', e && e.message); return null; } // qualsiasi problema → fusion auto, mai errore
}
