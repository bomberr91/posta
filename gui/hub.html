const IMG_EXTS = ['png','jpg','jpeg','webp','gif','bmp','avif','svg','ico','tiff','tif'];
function isImageFile(f){
  if (f.type && f.type.startsWith('image/')) return true;
  return IMG_EXTS.includes(((f.name||'').split('.').pop()||'').toLowerCase());
}
function fileToDataUrl(file){
  return new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = ()=>rej(new Error('lettura fallita')); fr.readAsDataURL(file); });
}
function downscaleImage(file){ // il centralino le rimpicciolisce comunque, ma partiamo già leggeri
  // tiff/heic: il browser non li decodifica — il tiff lo spoglia il centralino (libvips)
  if (file.type === 'image/tiff' || /\.(tiff?|heic|heif)$/i.test(file.name||'')) return fileToDataUrl(file);
  return new Promise((res)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      try {
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h){ res(fr.result); return; }
        const sc = Math.min(1, 1024/Math.max(w,h));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1,Math.round(w*sc)); cv.height = Math.max(1,Math.round(h*sc));
        const cx = cv.getContext && cv.getContext('2d');
        if (!cx){ res(fr.result); return; } // niente canvas → immagine originale
        cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.85));
      } catch { res(fr.result); }
    }; img.onerror = ()=>res(fr.result); img.src = fr.result; };
    fr.onerror = ()=>res(null);
    fr.readAsDataURL(file);
  });
}

// ── PDF: lettura del testo senza librerie (stream FlateDecode via DecompressionStream) ──
function bytesToStr(u8){ let s=''; const CH=8192; for (let i=0;i<u8.length;i+=CH){ s += String.fromCharCode.apply(null, u8.subarray(i,i+CH)); } return s; }
function strToBytes(s){ const u = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i] = s.charCodeAt(i)&0xFF; return u; }
async function inflateZlib(u8){
  try { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer()); }
  catch { return null; }
}
async function inflateRaw(u8){
  try { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
  catch { return null; }
}
function pdfParseString(s, i){ // s[i]==='(' → {str,next} con escape \( \) \\ \ddd
  let out='', j=i+1, depth=1;
  while (j < s.length){
    const ch = s[j];
    if (ch === '\\'){
      const nx = s[j+1];
      if (nx==='n'||nx==='r') out += '\n';
      else if (nx==='t') out += '\t';
      else if (nx==='b'||nx==='f') {}
      else if (nx>='0'&&nx<='7'){ let oct=''; let k=j+1; while (k<s.length && k<=j+3 && s[k]>='0' && s[k]<='7'){ oct+=s[k]; k++; } out += String.fromCharCode(parseInt(oct,8)); j = k-1; }
      else out += nx;
      j += 2; continue;
    }
    if (ch === '(') depth++;
    if (ch === ')'){ depth--; if (!depth) return { str: out, next: j+1 }; }
    out += ch; j++;
  }
  return { str: out, next: j };
}
function pdfExtractText(content){ // stringhe (…) e <…> + a-capo su Td/TD/Tm/T*/ET
  let out = '', i = 0;
  const push = t => { if (t){ if (out && !/[\s\n]$/.test(out)) out += ' '; out += t; } };
  while (i < content.length){
    const ch = content[i];
    if (ch === '('){ const r = pdfParseString(content, i); push(r.str); i = r.next; continue; }
    if (ch === '<'){ const j = content.indexOf('>', i); if (j<0) break; const hex = content.slice(i+1,j); if (hex.trim() && /^[0-9A-Fa-f\s]*$/.test(hex)){ let s2=''; for (let k=0;k+3<hex.length;k+=4){ const code = parseInt(hex.slice(k,k+4).replace(/\s/g,''),16); if (code) s2 += String.fromCharCode(code); } push(s2); } i = j+1; continue; }
    if (content.startsWith('T*', i) || content.startsWith('Td', i) || content.startsWith('TD', i) || content.startsWith('Tm', i) || content.startsWith('ET', i)) out += '\n';
    i++;
  }
  return out;
}
let pdfJsLoading = null;
function ensurePdfJs(){ // caricato pigro: solo quando arrivi davvero un PDF
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfJsLoading) return pdfJsLoading;
  pdfJsLoading = new Promise((res)=>{
    const s = document.createElement('script');
    s.src = '/pdfjs/pdf.min.js';
    s.onload = ()=>{ try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.js'; } catch {} res(window.pdfjsLib || null); };
    s.onerror = ()=>res(null);
    document.head.appendChild(s);
    setTimeout(()=>res(window.pdfjsLib || null), 8000);
  });
  return pdfJsLoading;
}
async function pdfJsExtract(buf){
  const lib = await ensurePdfJs();
  if (!lib) return null;
  const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  let all = '';
  for (let p=1; p<=doc.numPages; p++){
    const pg = await doc.getPage(p);
    const tc = await pg.getTextContent();
    let last = null, line = ''; const lines = [];
    for (const it of (tc.items||[])){
      if (!it.str) continue;
      const y = it.transform ? Math.round(it.transform[5]) : null;
      if (last !== null && y !== null && Math.abs(y-last) > 2 && line){ lines.push(line); line = ''; }
      line += (line && !/\s$/.test(line) && !/^\s/.test(it.str) ? ' ' : '') + it.str;
      last = y;
    }
    if (line) lines.push(line);
    if (lines.length) all += lines.join('\n') + '\n\n';
  }
  return all.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
async function extractPdfText(buf){
  try {
    const viaLib = await pdfJsExtract(buf); // pdf.js: font veri e encoding veri (ricevute, esportazioni complesse)
    if (viaLib) return viaLib;
  } catch {} // pdf.js non caricato o PDF rotto → parser interno (best effort)
  const out = await extractPdfTextRaw(buf);
  if (!out) throw new Error('nessun testo trovato (PDF scannerizzato o fatto di sole immagini? se hai il testo, incollalo in chat)');
  return out;
}
async function extractPdfTextRaw(buf){
  const s = bytesToStr(new Uint8Array(buf));
  let all = '', pos = 0;
  while (true){
    const a = s.indexOf('stream', pos); if (a < 0) break;
    const b = s.indexOf('endstream', a); if (b < 0) break;
    const dictStart = Math.max(0, a-600), dict = s.slice(dictStart, a);
    if (/\/(FontFile|DCTDecode|JPXDecode|CCITTFaxDecode|JBIG2Decode)/.test(dict)){ pos = b+9; continue; } // font e immagini: non sono testo
    let start = a+6;
    if (s[start]==='\r') start += 2; else if (s[start]==='\n') start += 1;
    let chunk = s.slice(start, b);
    if (/FlateDecode/.test(dict)){ const u8 = await inflateZlib(strToBytes(chunk)); if (u8) chunk = bytesToStr(u8); else { pos = b+9; continue; } }
    const t = pdfExtractText(chunk);
    const clean = (t.match(/[\x20-\x7E\u00A0-\u00FF\n\t]/g)||[]).length; // scarta la spazzatura binaria
    if (t.trim() && clean >= t.length*0.6) all += t + '\n';
    pos = b+9;
  }
  return all.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}

// ── DOCX / ODT: sono zip → leggo la xml e spollo il testo ──
async function zipReadEntry(buf, wanted){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length-22; i >= 0 && i > u8.length-65558; i--){ if (dv.getUint32(i,true) === 0x06054b50){ eocd = i; break; } }
  if (eocd < 0) throw new Error('file zip non valido');
  const count = dv.getUint16(eocd+10, true);
  let off = dv.getUint32(eocd+16, true);
  const td = new TextDecoder();
  for (let n=0; n<count; n++){
    if (dv.getUint32(off,true) !== 0x02014b50) break;
    const method = dv.getUint16(off+10,true), csize = dv.getUint32(off+20,true);
    const nlen = dv.getUint16(off+28,true), elen = dv.getUint16(off+30,true), clen = dv.getUint16(off+32,true);
    const lho = dv.getUint32(off+42,true);
    const name = td.decode(u8.subarray(off+46, off+46+nlen));
    if (name === wanted){
      if (dv.getUint32(lho,true) !== 0x04034b50) throw new Error('zip corrotto');
      const lnlen = dv.getUint16(lho+26,true), lelen = dv.getUint16(lho+28,true);
      const start = lho + 30 + lnlen + lelen;
      const data = u8.subarray(start, start+csize);
      if (method === 0) return td.decode(data);
      if (method === 8){ const out = await inflateRaw(data); if (out) return td.decode(out); throw new Error('decompressione fallita'); }
      throw new Error('compressione non gestita');
    }
    off += 46 + nlen + elen + clen;
  }
  return null;
}
function xmlToText(x){
  return x.replace(/<w:tab[^>]*\/>/g,'\t').replace(/<w:br[^>]*\/?>/g,'\n')
    .replace(/<\/(w:p|text:p|text:h|p|h)>/g,'\n').replace(/<[^>]+>/g,'')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&')
    .replace(/\n{3,}/g,'\n\n').trim();
}
async function addFiles(files){
  if (!cur()) newChat(true);
  for (const f of files){
    try {
      if (/\.(heic|heif)$/i.test(f.name||'') || f.type === 'image/heic' || f.type === 'image/heif'){
        throw new Error('formato HEIC (iPhone) non supportato — converti in JPG (su iPhone: foto → condividi → formatta come JPEG, o scatta con "Molto compatibile")');
      }
      if (isImageFile(f)){
        const dataUrl = await downscaleImage(f);
        if (!dataUrl) throw new Error('lettura fallita');
        atts.push({ kind:'img', name: f.name || 'immagine', dataUrl });
      } else {
        const ext = ((f.name||'').split('.').pop()||'').toLowerCase();
        let text = null;
        if (ext==='pdf') text = await extractPdfText(await f.arrayBuffer());
        else if (ext==='docx' || ext==='odt'){
          const xml = await zipReadEntry(await f.arrayBuffer(), ext==='docx' ? 'word/document.xml' : 'content.xml');
          if (!xml) throw new Error('struttura inattesa');
          text = xmlToText(xml);
        } else {
          if (f.size > 2*1024*1024) throw new Error('file di testo troppo grande (max 2 MB)');
          text = await f.text();
        }
        if (!text || !text.replace(/\s+/g,'').length) throw new Error('nessun testo trovato dentro il file');
        atts.push({ kind:'doc', name: f.name || 'documento', text });
      }
    } catch (e){
      cur().msgs.push({ role:'error', content: '📎 '+(f.name||'file')+': non sono riuscito a leggerlo — '+(e.message||'errore')+' — prova a incollare il testo direttamente in chat.' });
    }
  }
  saveChats(); renderChat(); renderAtts();
}

optB.onclick = async ()=>{

  if (ctrl) return;
  const provOpt = (sel.value||'routerhub/auto:smart').split('/')[0];
  let model = (sel.value||'routerhub/auto:smart').split('/').slice(1).join('/');
  if (provOpt !== 'routerhub') model = 'auto'; // per ✨ serve un modello del router Hub
  if (['fusion','code','trading','vision'].includes(model) || model.startsWith('team::')) model = 'auto'; // per l'ottimizzazione niente pannelli: gli alias dell'hub non esistono sul centralino
  else if (model==='tailor' || model==='docs') model = 'auto:smart';
  optB.disabled = true; optB.textContent = '…';
  try {
    const out = await apiChatOnce({ provider:'routerhub', model, messages:[{role:'system',content:OPT_SYS},{role:'user',content:raw}] });
    if (out){ optOrig = raw; qEl.value = out; undoB.style.display = 'inline-block'; qEl.focus(); }
    else alert('✨ il modello ha risposto vuoto — riprova');
  } catch (e){ alert('✨ non riuscito: '+e.message); }
  finally { optB.disabled = false; optB.textContent = '✨'; }
};
undoB.onclick = ()=>{ if (optOrig!=null){ qEl.value = optOrig; optOrig = null; undoB.style.display = 'none'; qEl.focus(); } };
qEl.addEventListener('input', ()=>{ optOrig = null; undoB.style.display = 'none'; });

    try {

      const keep=existingSelect.value;
      existingSelect.replaceChildren();

        existingSelect.appendChild(o);
      }
      if(keep && [...existingSelect.options].some(o=>o.value===keep)) existingSelect.value=keep;
      if(!existingSelect.options.length){ const o=document.createElement('option'); o.value=''; o.textContent='Nessun token revocabile'; o.disabled=true; existingSelect.appendChild(o); }
      tokenState.textContent=(d.tokens||[]).length+' token revocabili registrati. I segreti non vengono recuperati né mostrati.';
      tc.disabled=!(d.models||[]).length;
      tr.disabled=!(d.tokens||[]).length;
    } catch(e){ tokenState.textContent='Gestione token non disponibile: '+e.message; }
  }
  aggiornaStatoToken();
  if (tc) tc.onclick = async (ev)=>{ ev.preventDefault(); ev.stopPropagation(); tc.disabled=true;
    try {
      const model=modelSelect.value;

      const r = await fetch('/api/agent-tokens', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ta.value.trim(),models:[model]})});
      const j = await r.json(); if(!r.ok) throw new Error(j.err||('HTTP '+r.status));
      const snippet='base_url = "http://127.0.0.1:20200/v1"\napi_key = "'+j.token+'"\nmodel = "'+model+'"';
      try { await navigator.clipboard.writeText(snippet); tm.textContent='Token creato e configurazione copiata negli appunti. Salvala nell’agente: non sarà più recuperabile.'; }

      tm.textContent='Token revocato.'; await aggiornaStatoToken();
    } catch(e){ tm.textContent='⚠ '+e.message; } finally { tr.disabled=false; }
  };
}
async function aggiornaStatoRouterHub(){
  const dot = document.getElementById('routerHubDot');
  const box = document.getElementById('routerHubStatus');
  const catalog = document.getElementById('routerModelList');
  if (!dot || !box) return;
  try {
    const r = await fetch('/api/modelli', { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    dot.className = 'dot ok';
    box.textContent = `Router Hub locale raggiungibile. Catalogo: ${Number(j.totali||0)} modelli; ${Number(j.pronti_verificati||0)} hanno già superato una prova chat. Questo controllo non chiama modelli.`;
    if(catalog){ const items=j.data||[]; catalog.textContent=items.length ? 'Catalogo: '+items.map(m=>m.id+' ('+(m.stato||'stato non verificato')+')').join(' · ') : 'Catalogo locale vuoto.'; }
  } catch(e) {
    dot.className = 'dot';
    box.textContent = 'Router Hub locale non raggiungibile. Avvia la Centrale sul PC; nessun provider è stato chiamato.';
    if(catalog) catalog.textContent='Catalogo modelli non disponibile.';
  }
}
function fmtNum(n){ return (n===null||n===undefined) ? '—' : Number(n).toLocaleString('it-IT'); }
async function riempiCapacita(){
  const box = document.getElementById('capBox'); if (!box) return;
  const griglia = 'display:grid;grid-template-columns:minmax(100px,1fr) repeat(2,minmax(80px,auto));gap:5px 10px;font-size:11.5px;font-family:ui-monospace,monospace;';
  let out = '';
  try {
    const [rc, ru] = await Promise.all([fetch('/api/capacita'), fetch('/api/contabilita')]);
    if (!rc.ok || !ru.ok) throw new Error('HTTP ' + (!rc.ok ? rc.status : ru.status));
    const c = await rc.json();
    const u = await ru.json();
    const tetti = (c.righe || []).filter(r => r.req_giorno || r.tok_giorno || r.req_mese || r.tok_mese);
    out += '<div style="margin:2px 0 6px"><b>Tetti dichiarati</b> <span style="color:var(--mut)">(non sono quote residue né misure in tempo reale)</span></div>';
    if (tetti.length) {
      out += '<div style="' + griglia + '"><b>Provider</b><b>Tetto registrato</b><b>Richieste oggi</b>' +
        tetti.slice(0,20).map(r => {
          const limiti = [r.req_giorno ? fmtNum(r.req_giorno) + ' req/g' : '',
                          r.tok_giorno ? fmtNum(r.tok_giorno) + ' tok/g' : '',
                          r.req_mese ? fmtNum(r.req_mese) + ' req/mese' : '',
                          r.tok_mese ? fmtNum(r.tok_mese) + ' tok/mese' : '', r.nota || '']
                         .filter(Boolean).join(' · ');
          return '<span>' + esc(r.nome) + '</span><span style="color:var(--mut)">' + esc(limiti) +
                 '</span><span>' + fmtNum(r.oggi_chiamate) + '</span>';
        }).join('') + '</div>';
    } else {
      out += '<div style="color:var(--mut)">Nessun tetto dichiarato nel registro locale.</div>';
    }
    const fatti = u.provider || [];
    out += '<div style="margin:12px 0 5px;border-top:1px solid var(--border);padding-top:8px"><b>Attività registrata oggi</b></div>';
    if (fatti.length) {
      const tot = u.totali || {};
      out += '<div class="hint">' + fmtNum(tot.richeste || 0) + ' richieste · ' +
             fmtNum(tot.successi || 0) + ' riuscite · ' + fmtNum(tot.errori || 0) +
             ' errori · ' + fmtNum(tot.token || 0) + ' token conteggiati</div>';
      out += '<div style="' + griglia + ';margin-top:7px"><b>Provider</b><b>Esito · errori</b><b>Token · latenza media</b>' +
        fatti.slice(0,20).map(r => '<span>' + esc(r.nome) + '</span><span>' + fmtNum(r.ok) + '/' +
          fmtNum(r.chiamate) + ' ok · ' + fmtNum(r.errori) + ' err' +
          (r.in_pausa ? ' · pausa ' + fmtNum(r.in_pausa) + 's' : '') + '</span><span>' +
          fmtNum(r.token) + ' · ' + fmtNum(r.ms) + ' ms</span>').join('') + '</div>';
    } else {
      out += '<div style="color:var(--mut)">Nessuna richiesta diretta registrata oggi.</div>';
    }
    out += '<div style="margin-top:8px;color:var(--mut);font-size:11px">Questi numeri includono solo le chiamate registrate da questo Router Hub. Le richieste instradate dal Portiere possono avere contatori separati; non interpretarli come totale complessivo o saldo residuo.</div>';
  } catch(e) {
    out = '⚠️ Non riesco a leggere quote e attività: ' + esc(e.message || 'errore');
  }
  box.innerHTML = out;
}

  details.addEventListener('toggle',async()=>{
    if(!details.open || loaded) return;
    list.textContent='Carico i risultati…';
    try { const r=await fetch('/api/risultati'); if(!r.ok) throw new Error(); const d=await r.json(); names=Array.isArray(d.data)?d.data:[]; loaded=true; render(); }
    catch(e){ list.textContent='Archivio non disponibile.'; }
  });
  search.addEventListener('input',render);
})();

// ══════════ init ══════════
// la TENDINA per prima: se qualcosa più sotto va storto, almeno i modelli ci sono sempre
refreshModelSelect();
try { loadState(); } catch(e){ console.error('loadState', e); }
try { renderSidebar(); } catch(e){ console.error('renderSidebar', e); }
try { renderChat(); } catch(e){ console.error('renderChat', e); }
const godEl = $('god'), godL = $('godl');
godEl.checked = lsGet('fh_god') !== '0'; // ON di default (decisione utente 10/10): lo spegni tu se vuoi la modalità pulita
godL.classList.toggle('on', godEl.checked);
godEl.onchange = () => { lsSet('fh_god', godEl.checked ? '1' : '0'); godL.classList.toggle('on', godEl.checked); };
const keepEl = $('keep');
keepEl.checked = lsGet('fh_keep') === '1';
keepEl.onchange = () => lsSet('fh_keep', keepEl.checked ? '1' : '0');
syncGodUI();
const sysEl = $('sys');
sysEl.value = lsGet('fh_sys') || '';
sysEl.oninput = () => lsSet('fh_sys', sysEl.value);
</script>
